name: To do list - Status

on:
  schedule:
    - cron: '0 */6 * * *'  # la fiecare 6 ore  
  workflow_dispatch:


jobs:
  update-todo-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permisiune să scrie în README
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Project Items & Update README
        id: update-readme
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}  # ← suprascrie token-ul default!
          script: |
            const fs = require('fs');

            // === CONFIGURARE ===
            const PROJECT_NUMBER = 12;        // Înlocuiește cu numărul proiectului tău
            const COLUMN_TO_DO = 'To do';                   // Numele coloanei pentru "To do"
            const COLUMN_IN_PROGRESS = 'In Progress';  // Numele coloanei pentru "în progres"
            const COLUMN_DONE = 'Done';               // Numele coloanei pentru "finalizat"
            const LIMIT_TODO = 5;                 // limita pentru To do
            const LIMIT_PROGRESS = 0;             // 0 = fara limita
            const LIMIT_DONE = 5;                 // limita pentru Done



            // 1. Funcția pentru proiecte
              async function getProjectItems(projectNumber, username) {
              let allItems = [];
              let hasNextPage = true;
              let endCursor = null;
              
              while (hasNextPage) {
                const query = `
                  query {
                    user(login: "${username}") {
                      projectV2(number: ${projectNumber}) {
                        title
                        items(first: 100) {
                          nodes {
                            content {
                              __typename
                              ... on DraftIssue {
                                title
                              }
                              ... on Issue {
                                title
                              }
                              ... on PullRequest {
                                title
                              }
                            }
                            fieldValues(first: 10) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  name
                                  field {
                                    ... on ProjectV2FieldCommon {
                                      name
                                    }
                                  }
                                }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }
                `;
                
                const result = await github.graphql(query, { cursor: endCursor });
                const project = result.user.projectV2;
                
                if (!project) {
                  console.log('❌ Proiectul nu a fost găsit');
                  break;
                }
                
                const items = project.items.nodes;
                allItems = allItems.concat(items);
                
                hasNextPage = project.items.pageInfo.hasNextPage;
                endCursor = project.items.pageInfo.endCursor;
              }
              
              return allItems;
            }

            // Folosește așa:
            const items = await getProjectItems(PROJECT_NUMBER, context.repo.owner);
            console.log(`✅ ${items.length} item-uri încărcate`);

            // 2. Filtrează item-urile cu status
            function getStatus(item) {
              // Verificări explicite
              if (!item.fieldValues) {
                console.warn('⚠️ Item-ul nu are fieldValues');
                return 'N/A';
              }
              
              if (!item.fieldValues.nodes) {
                console.warn('⚠️ fieldValues nu are nodes');
                return 'N/A';
              }
              
              // Găsește statusul
              const statusNode = item.fieldValues.nodes.find(n => {
                if (!n.field) return false;
                return n.field.name === 'Status';
              });
              
              if (!statusNode) {
                console.warn('⚠️ Nu s-a găsit câmpul "Status"');
                return 'N/A';
              }
              
              return statusNode.name || 'N/A';
            }

            // array-uri din filtrare
            const todoItems = items.filter(item => getStatus(item) === COLUMN_TO_DO);
            const doneItems = items.filter(item => getStatus(item) === COLUMN_DONE);
            const inProgressItems = items.filter(item => getStatus(item) === COLUMN_IN_PROGRESS);

            console.log(`📋 To do: ${todoItems.length}`);
            console.log(`✅ Done: ${doneItems.length}`);
            console.log(`🔄 In Progress: ${inProgressItems.length}`);

            // 3. Aplică limitele direct pe array-uri
            function applyLimit(items, limit) {
              if (limit === 0) {
                return items;  // fără limită - returnează toate
              }
              return items.slice(0, limit);
            }

            const todo_limit = applyLimit(todoItems, LIMIT_TODO);
            const inProgress_limit = applyLimit(inProgressItems, LIMIT_PROGRESS);
            const done_limit = applyLimit(doneItems, LIMIT_DONE);


            // 4. Generează lista completă - MAI ÎNTÂI DONE, APOI IN PROGRESS, APOI TODO
            function generateFullList(todo, inProgress, done) {
              let list = [];
              
              // Adaugă itemele finalizate (bifate)
              done.forEach(item => {
                const title = item.content.title || 'Item fără titlu';
                list.push(`- [x] ${title}`);
              });

              // Adaugă itemele în progres (debifate)
              inProgress.forEach(item => {
                const title = item.content.title || 'Item fără titlu';
                list.push(`- [ ] ${title}`);
              });

              // Adauga itemele Todo (debifate)
              todo.forEach(item => {
                const title = item.content.title || 'Item fără titlu';
                list.push(`- [ ] ${title}`);
              });

              return list.join('\n');
            }

            // 6. Genereaza lista            
            const fullList = generateFullList(todo_limit, inProgress_limit, done_limit);

            // 7. Citeste README-ul
            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            // 8. Inlocuieste continutul dintre markere
            const startMarker = '<!-- TODO-LIST:START -->';
            const endMarker = '<!-- TODO-LIST:END -->';

            const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            const newContent = `${startMarker}\n${fullList}\n${endMarker}`;

            const updatedReadme = readme.replace(regex, newContent);
            

            // 9. Verifica daca s-au facut schimbari si salveaza
            if (updatedReadme !== readme) {
              fs.writeFileSync(readmePath, updatedReadme);
              console.log(`✅ README actualizat cu succes!`);
              // Setează output-ul pentru step-ul următor
              core.setOutput('has_changes', 'true');
            } else {
              console.log(`ℹ️ Nicio schimbare detectată. README-ul este deja actualizat.`);
              core.setOutput('has_changes', 'false');
            }

      - name: Commit & Push changes
        if: steps.update-readme.outputs.has_changes == 'true' && env.ACT != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update progress from GitHub Project [skip ci]"
          file_pattern: README.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
      
      - name: Show README (local only)
        if: env.ACT == 'true'
        run: |
          echo "📄 README generat local:"
          cat README.md
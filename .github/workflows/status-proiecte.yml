name: Update project statuses

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, Check & Update README
        id: update-readme
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}  # ← suprascrie token-ul default!
          script: |
            const fs = require('fs');
            
            // === CONFIGURARE ===
            const PROJECT_NUMBER = 13;
            const startMarker = '<!-- PROJECTS_START -->';
            const endMarker = '<!-- PROJECTS_END -->';
            const readmePath = 'README.md';
            
            // ============================================
            // 1. FETCH - ia item-urile din proiect
            // ============================================
            console.log('📥 Fetching project items...');
            
            async function getProjectItems(projectNumber, username) {
              let allItems = [];
              let hasNextPage = true;
              let endCursor = null;
              
              while (hasNextPage) {
                const query = `
                  query {
                    user(login: "${username}") {
                      projectV2(number: ${projectNumber}) {
                        items(first: 100) {
                          nodes {
                            content {
                              __typename
                              ... on DraftIssue { title body }
                              ... on Issue { title body }
                              ... on PullRequest { title body }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }
                `;
                
                const result = await github.graphql(query, { cursor: endCursor });
                const project = result.user?.projectV2;
                
                if (!project) {
                  console.log('❌ Proiectul nu a fost găsit');
                  break;
                }
                
                const items = project.items?.nodes || [];
                allItems = allItems.concat(items);
                
                hasNextPage = project.items?.pageInfo?.hasNextPage || false;
                endCursor = project.items?.pageInfo?.endCursor || null;
              }
              
              return allItems;
            }

            const items = await getProjectItems(PROJECT_NUMBER, context.repo.owner);
            console.log(`✅ ${items.length} item-uri încărcate`);
            
            // ============================================
            // 2. CHECK - verifică statusul fiecărui repo
            // ============================================
            console.log('🔍 Checking repository statuses...');
            
            const tableData = [];
            let processed = 0;
            
            for (const item of items) {
              const repo = item.content?.title || 'Fără titlu';
              const description = item.content?.body || 'Fără descriere';
              let status = '';
              
              try {
                const response = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: repo
                });
                status = response.data.archived 
                  ? '![Status](https://img.shields.io/badge/Status-Arhivat-red)'
                  : '![Status](https://img.shields.io/badge/Status-Activ-brightgreen)';
                processed++;
              } catch(error) {
                console.log(`⚠️ Eroare pentru ${repo}: ${error.message}`);
                status = ' ❌ Eroare ';
              }
              
              const titluLinkRepo = `[${repo}](https://github.com/${context.repo.owner}/${repo})`;
              tableData.push({
                numeLinkRepo: titluLinkRepo,
                status: status,
                description: description
              });
            }
            
            console.log(`✅ ${processed} repo-uri procesate`);
            
            // ============================================
            // 3. BUILD - construiește tabelul markdown
            // ============================================
            console.log('📝 Building markdown table...');
            
            let markdown = '';
            if (tableData.length === 0) {
              markdown += '📭 Nu există proiecte de afișat în acest moment.\n\n';
            } else {
              markdown += '| Name | Status | Description |\n';
              markdown += '| :--- | :---: | :--- |\n';
              for (const row of tableData) {
                markdown += `| ${row.numeLinkRepo} | **${row.status}** | ${row.description} |\n`;
              }
            }
            
            // ============================================
            // 4. UPDATE - actualizează README
            // ============================================
            console.log('📄 Updating README...');
            
            let readme = fs.readFileSync(readmePath, 'utf8');
            
            const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            const newContent = `${startMarker}\n${markdown}\n${endMarker}`;
            const updatedReadme = readme.replace(regex, newContent);
            
            if (updatedReadme !== readme) {
              fs.writeFileSync(readmePath, updatedReadme);
              console.log('✅ README actualizat cu succes!');
              core.setOutput('has_changes', 'true');
            } else {
              console.log('ℹ️ Nicio schimbare detectată.');
              core.setOutput('has_changes', 'false');
            }

      - name: Commit & Push changes
        if: steps.update-readme.outputs.has_changes == 'true' && env.ACT != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update project cards status [skip ci]"
          file_pattern: README.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"